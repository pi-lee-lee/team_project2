astar_planner:
  ros__parameters:
    map_topic: map
    robot_radius: 0.24        # (m) 차체 반폭 0.153 + 여유보다 크게: A* 가 낸 틈을 로컬 플래너도 들어갈 수 있게.
                              # 0.20 이면 장애물 옆 0.40 m 틈으로 경로를 내서 재계획해도 같은 길에서 멈췄음 (2026-10-22).
                              # 제자리 회전 원(뒤 모서리 0.238, 뒤 부착물 0.28)은 회전 전 검사가 맡음
    inflation_radius: 0.55    # 이 거리까지는 벽에서 멀어지도록 비용 부여
    cost_weight: 3.0
    occupied_threshold: 65
    allow_unknown: false
    goal_tolerance: 0.3       # 목표가 벽에 붙어 있으면 이 반경 안에서 가까운 빈 곳으로
    scan_obstacles: true      # LiDAR 로 본, 맵에 없는 장애물을 잠시 기억해 경로 계획에 반영
    scan_memory: 20.0         # 장애물 기억 시간 (s)
    scan_max_range: 5.0       # 이보다 먼 LiDAR 점은 무시 (m). SLAM/AMCL 과 같은 5 m (예전 2.0)
    scan_wall_margin: 0.15    # 맵 벽에서 이 거리 안의 점은 벽으로 보고 무시 (m)
    bump_memory: 120.0        # 부딪힌 자리(LiDAR 에 안 보이는 낮은 물체)를 장애물로 기억하는 시간 (s)
    bump_radius: 0.15         # 부딪힌 자리(로봇 앞 0.25 m) 주변을 막는 반경 (m). 크면 좁은 통로가 통째로 막힘
    # 경로 계획용 맵 가공 (기존 맵 모드만, plan_map.py. AMCL 은 원본 맵 그대로). 결과는 astar/plan_map 토픽
    stripe_cells: 2           # 빈 칸 사이 폭 4칸(20cm) 미만 미탐색 줄무늬 → 빈 칸 (먼 곳 LiDAR 빔 사이). 0 이면 끔
    cluster_inflate: 0.1      # 책상/의자 다리 점(작은 덩어리)을 부풀림 → 다리 사이 2*(0.25+0.1)=0.7m 미만 틈이 막힘 (m). 0 이면 끔
    cluster_max_size: 0.4     # 가로나 세로가 이보다 긴 장애물 덩어리(벽, 책상 앞판)는 부풀리지 않음 (m)
    start_clear_radius: 0.35  # 출발 위치 주변은 부풀린 점/금지 구역에서 뺌 (그 안에 서 있어도 빠져나오게) (m)

warehouse_bridge:
  ros__parameters:
    server_url: ws://localhost:8000/ws/robot/tb3/
    map_name: default         # 서버 DB에 저장될 맵 이름 (위치 좌표가 이 맵에 묶임)
    map_topic: map
    global_frame: map
    base_frame: base_footprint
    pose_rate: 5.0
    max_retries: 2
    footprint: [-0.197, 0.069, 0.153]   # Waffle Pi 외곽 직사각형 (x_min, x_max, 반폭). Frenet 충돌 검사, 물러나기/회전 여유
    footprint_extra: [-0.277, -0.197, -0.04, 0.04]   # 차체에 붙인 물건 사각형 (x_min, x_max, y_min, y_max) x N. 뒤쪽 가운데 8x8cm. Frenet 충돌 검사, 제자리 회전/후진 여유, 웹 로봇 모양
    stop_distance: 0.35       # 차체가 기운 채 앞쪽 ±25° 이 거리(LiDAR 기준) 안이 막히면 장애물에 걸친 것으로 보고 물러남
    estop_distance: 0.2       # 앞쪽 ±25° 이 거리(LiDAR 기준, 차체 앞 끝에서 약 7cm) 안이면 앞으로는 안 감 (비상 정지)
    blocked_timeout: 5.0      # 이 시간 넘게 막히면 장애물을 피하는 경로로 재계획, 재시도도 다 쓰면 실패 (s)
    progress_timeout: 15.0    # 이 시간 동안 5cm도 못 가면 실패 (s)
    tf_timeout: 0.5           # 로봇 위치 TF가 이보다 오래되면 즉시 정지 (s)
    rotate_timeout: 15.0      # 제자리 회전이 이보다 길면 정지 후 재계획/실패 (s)
    bump_tilt_deg: 6.0        # 주행 중 기울기가 이보다 크면 부딪힘(낮은 장애물에 올라탐)으로 보고 정지, 뒤로 물러남 (도)
    stall_timeout: 2.5        # 앞으로 가라고 했는데 이 시간 동안 3cm 도 못 가면 부딪힘/끼임으로 봄 (s)
    backoff_distance: 0.15    # 부딪힌 뒤 뒤로 물러나는 거리 (m). 이후 부딪힌 자리를 피해 재계획
    battery_cells: 3          # 배터리 % 계산용 LiPo 셀 수 (TurtleBot3 11.1V = 3셀)
    battery_empty_v: 11.0     # 이 전압을 0% 로 표시 (TurtleBot3 는 11V 아래에서 충전 경고)
    # 움직이는 장애물 추적 (tb3_nav obstacle_tracker 이식). 웹 지도에 주황 원 + 속도 화살표, Frenet 이 예측해서 피함
    tracking:
      enabled: true
      moving_speed: 0.08      # 이보다 빠른 track 만 움직이는 물체로 예측/웹 표시 (멈춘 물체 속도 노이즈 중앙값 0.06, 느린 사람 0.1)
      max_range: 5.0          # 추적 + Frenet 정적 장애물에 쓰는 LiDAR 거리 (m). SLAM/AMCL 과 같은 5 m (예전 3.0)
      static_match_dist: 0.15 # 지도 벽에서 이 거리 이내 점은 정적 (AMCL 오차 감안)
      cluster_gap: 0.25
      min_points: 2
      max_diameter: 0.8       # 이보다 큰 덩어리(벽 등)는 장애물로 보지 않음
      min_radius: 0.05
      gate: 0.55              # 이전 track 과 이 거리 안이면 같은 물체
      min_hits: 5             # 이만큼 연속으로 보여야 확정
      max_misses: 5
      accel_noise: 1.8
      meas_noise: 0.13
      max_speed: 1.5
    # Frenet 로컬 플래너 (frenet.py). A* 경로를 기준선으로 '옆 오프셋 x 옆 이동/유지 거리 x 속도' 후보 중 안전하고 싼 궤적.
    # 정적 장애물은 거리(check_dist)로, 움직이는 물체는 시간(horizon)으로 검사. 실행 중에 바꿀 수 있음 (목록 값 제외)
    frenet:
      target_speed: 0.15      # (m/s) 후보 속도: 이 값부터 speed_step 씩 n_speed 개 더 낮춘 것
      speed_step: 0.05
      n_speed: 2
      max_speed: 0.18
      max_accel: 0.3          # 속도 프로필 가/감속 (m/s²)
      max_w: 1.82             # 후보 각속도 한계 |v·κ| (rad/s)
      rotate_speed: 1.0       # 출발 전 돌아서기 (rad/s). 0.6 은 실물에서 180° 도는 데 5초 넘게 걸렸음. SLAM 모드는 0.6 으로 (브리지)
      max_offset: 0.3         # 옆 오프셋 후보 ±(m). 통로 약 0.9 m
      offset_step: 0.025      # 실제 소화기 틈(양쪽 9 cm)은 5 cm 간격으로는 가운데를 못 맞춰 막혔음
      lateral_dists: [0.4, 0.6]        # 옆으로 가는(돌아오는) 거리 후보 (m)
      hold_dists: [0.0, 0.3, -1.0]     # 오프셋 유지 거리 후보 (m), 음수 = 돌아오지 않음
      check_dist: 1.0         # 정적 장애물 검사 거리 (m): 이만큼 앞에서부터 비켜 감. 다 막히면 이만큼 앞에서 섬
      horizon: 4.0            # 움직이는 물체 검사 시간 (s)
      safety_margin: 0.06     # 차체와 장애물 최소 여유 (제약). 0.08 은 실제 소화기 옆 0.5 m 틈을 못 지나갔음 (기록 분석 2026-10-23)
      clear_pref: 0.15        # 여유가 이보다 작으면 비용 (틈에서는 가운데 쪽)
      dynamic_margin: 0.15    # 움직이는 물체 추가 여유 (m)
      dynamic_growth: 0.03    # 예측 1초당 여유 증가
      w_offset: 1.0           # 비용 계수: 경로에서 벗어남 / 오프셋 바뀜 / 꺾는 기울기 / 느림 / 정적 여유 / 움직이는 물체 여유
      w_change: 1.0           # 경로로 돌아오는 쪽은 1/4. 0.3 은 좁은 곳에서 오프셋이 주기마다 바뀌어 w 가 튐 (기록 18개 폐루프: 오프셋 바뀜 181 → 107, 도착 수 같음)
      w_turn: 0.5
      w_speed: 1.0
      w_clear: 1.0
      w_dynamic: 1.0
    # 주행 기록: logs/records/<브리지 켠 시각>_frenet/<시각>_<목표>/record.jsonl.gz (0.1초마다 위치/명령/트래킹/스캔,
    # Frenet 입력과 후보별 판정·비용까지). 분석: python3 tools/drive_replay.py. 1분에 약 2 MB
    record:
      enabled: true
