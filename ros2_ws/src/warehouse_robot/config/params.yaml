astar_planner:
  ros__parameters:
    map_topic: map
    robot_radius: 0.28        # 외곽 반경 (m): 차체 뒤 모서리 (0.197, 0.153) → 0.25, 뒤에 붙인 8x8cm (0.277, 0.04) → 0.28. 제자리 회전 때 닿지 않게
    inflation_radius: 0.55    # 이 거리까지는 벽에서 멀어지도록 비용 부여
    cost_weight: 3.0
    occupied_threshold: 65
    allow_unknown: false
    goal_tolerance: 0.3       # 목표가 벽에 붙어 있으면 이 반경 안에서 가까운 빈 곳으로
    scan_obstacles: true      # LiDAR 로 본, 맵에 없는 장애물을 잠시 기억해 경로 계획에 반영
    scan_memory: 20.0         # 장애물 기억 시간 (s)
    scan_max_range: 5.0       # 이보다 먼 LiDAR 점은 무시 (m). SLAM/AMCL 과 같은 5 m (예전 2.0)
    scan_wall_margin: 0.15    # 맵 벽에서 이 거리 안의 점은 벽으로 보고 무시 (m)
    bump_memory: 120.0        # 부딪힌 자리(LiDAR 에 안 보이는 낮은 물체)를 장애물로 기억하는 시간 (s)
    bump_radius: 0.15         # 부딪힌 자리(로봇 앞 0.25 m) 주변을 막는 반경 (m). 크면 좁은 통로가 통째로 막힘
    # 경로 계획용 맵 가공 (기존 맵 모드만, plan_map.py. AMCL 은 원본 맵 그대로). 결과는 astar/plan_map 토픽
    stripe_cells: 2           # 빈 칸 사이 폭 4칸(20cm) 미만 미탐색 줄무늬 → 빈 칸 (먼 곳 LiDAR 빔 사이). 0 이면 끔
    cluster_inflate: 0.1      # 책상/의자 다리 점(작은 덩어리)을 부풀림 → 다리 사이 2*(0.25+0.1)=0.7m 미만 틈이 막힘 (m). 0 이면 끔
    cluster_max_size: 0.4     # 가로나 세로가 이보다 긴 장애물 덩어리(벽, 책상 앞판)는 부풀리지 않음 (m)
    start_clear_radius: 0.35  # 출발 위치 주변은 부풀린 점/금지 구역에서 뺌 (그 안에 서 있어도 빠져나오게) (m)

warehouse_bridge:
  ros__parameters:
    server_url: ws://localhost:8000/ws/robot/tb3/
    map_name: default         # 서버 DB에 저장될 맵 이름 (위치 좌표가 이 맵에 묶임)
    map_topic: map
    global_frame: map
    base_frame: base_footprint
    planner: astar            # astar: 직접 구현한 A* + FollowPath / nav2: NavigateToPose
    pose_rate: 5.0
    max_retries: 2
    arrive_tolerance: 0.3     # Nav2가 성공이라고 해도 목표와 이 거리 이상이면 실패로 처리
    controller: dwa           # dwa(기본): 브리지의 DWA / builtin: 브리지의 pure pursuit로 직접 주행 / nav2: Nav2 controller_server 사용
    max_speed: 0.15           # m/s
    max_turn_speed: 1.0       # rad/s
    footprint_extra: [-0.277, -0.197, -0.04, 0.04]   # 차체에 붙인 물건 사각형 (x_min, x_max, y_min, y_max) x N. 뒤쪽 가운데 8x8cm. 제자리 회전/후진 여유, 웹 로봇 모양
    stop_distance: 0.35       # 앞쪽 ±25° 안에 이 거리 이내 물체가 있으면 정지 후 대기 (m)
    blocked_timeout: 5.0      # 이 시간 넘게 막히면 장애물을 피하는 경로로 재계획, 재시도도 다 쓰면 실패 (s)
    progress_timeout: 15.0    # 이 시간 동안 5cm도 못 가면 실패 (s)
    tf_timeout: 0.5           # 로봇 위치 TF가 이보다 오래되면 즉시 정지 (s)
    rotate_timeout: 15.0      # 제자리 회전이 이보다 길면 정지 후 재계획/실패 (s)
    bump_tilt_deg: 6.0        # 주행 중 기울기가 이보다 크면 부딪힘(낮은 장애물에 올라탐)으로 보고 정지, 뒤로 물러남 (도)
    stall_timeout: 2.5        # 앞으로 가라고 했는데 이 시간 동안 3cm 도 못 가면 부딪힘/끼임으로 봄 (s)
    backoff_distance: 0.15    # 부딪힌 뒤 뒤로 물러나는 거리 (m). 이후 부딪힌 자리를 피해 재계획
    battery_cells: 3          # 배터리 % 계산용 LiPo 셀 수 (TurtleBot3 11.1V = 3셀)
    battery_empty_v: 11.0     # 이 전압을 0% 로 표시 (TurtleBot3 는 11V 아래에서 충전 경고)
    follow_frame: odom        # FollowPath 경로 좌표계 (odom: controller_server가 map->odom TF 없이 주행)
    # 움직이는 장애물 추적 (tb3_nav obstacle_tracker 이식). 웹 지도에 주황 원 + 속도 화살표, controller=dwa 가 사용
    tracking:
      enabled: true
      max_range: 5.0          # 추적 + DWA 정적 장애물에 쓰는 LiDAR 거리 (m). SLAM/AMCL 과 같은 5 m (예전 3.0)
      static_match_dist: 0.15 # 지도 벽에서 이 거리 이내 점은 정적 (AMCL 오차 감안)
      cluster_gap: 0.25
      min_points: 2
      max_diameter: 0.8       # 이보다 큰 덩어리(벽 등)는 장애물로 보지 않음
      min_radius: 0.05
      gate: 0.55              # 이전 track 과 이 거리 안이면 같은 물체
      min_hits: 5             # 이만큼 연속으로 보여야 확정
      max_misses: 5
      accel_noise: 1.8
      meas_noise: 0.13
      max_speed: 1.5
    # controller: dwa 일 때 (tb3_nav local_planner 이식). 실수는 소수점을 붙일 것
    dwa:
      max_v: 0.15             # 내장 추종기와 같게 (하드웨어 한계 0.26)
      min_v: -0.08            # 느린 후진 (다가오는 장애물에서 물러나기)
      max_w: 1.0              # 내장 추종기와 같게 (하드웨어 한계 1.82)
      max_acc_v: 0.3          # sim 실측 1.0~1.2 m/s² (tools/step_test.py). 실물 미측정이라 보수적으로
      max_acc_w: 1.5          # sim 실측 7~12 rad/s². 보수적으로
      v_samples: 9
      w_samples: 21
      sim_dt: 0.1
      predict_time: 2.5       # tools/dwa_tune.py 로 비교: 3.0 보다 빠르고 충돌 없음
      robot_radius: 0.17      # 정규화/탐색 범위용 (충돌은 아래 footprint 직사각형으로 봄)
      footprint: [-0.197, 0.069, 0.153]   # Waffle Pi 외곽 직사각형 (x_min, x_max, 반폭). 원으로 덮으면 앞뒤가 커서 벽 옆에서 갇힘
      allow_escape: true      # 벽에 바짝 붙어 갈 궤적이 없으면 여유가 줄지 않는 이동은 허용
      reverse_only_when_needed: true   # 후진은 전진/회전으로 피할 수 없을 때만
      safety_margin: 0.08
      dynamic_margin: 0.15    # 움직이는 장애물 추가 여유. sim 추적 오차(95% 10cm)보다 크게. 0.25 는 너무 오래 기다림
      dynamic_growth: 0.03    # 예측 1초당 반경 증가
      obstacle_influence: 0.5
      w_heading: 0.3
      w_path: 1.5
      w_goal: 2.3
      w_obstacle: 1.2
      w_speed: 0.3
      w_collision: 2.0        # 1.0~6.0 사이에서 결과 차이 없음 (tools/dwa_tune.py), 덜 극단적인 값
    dwa_follow:
      lookahead: 0.5          # 경로 위 이 거리 앞 점을 DWA 목표로
      goal_tolerance: 0.1     # 이 안에 들면 제자리에서 도착 방향 맞춤
      moving_speed: 0.08      # 이보다 빠른 track 만 움직이는 장애물로 예측/웹 표시 (멈춘 물체 속도 노이즈 중앙값 0.06, 느린 사람 0.1)
