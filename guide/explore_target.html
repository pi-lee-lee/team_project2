<text x="52" y="972" class="cap" >줄 방향(u) = 벽의 주된 방향 4개 중 출발 시 로봇 방향에 가장 가까운 것 (그림은 축척 아님)</text>

<circle cx="564" cy="700.5" r="2.6" fill="#6b7280"/>
<text x="574" y="704.5" class="item" >wall_axis(): 벽 셀을 0~89° 로 돌려 투영한 히스토그램이 가장 뾰족한 각도</text>
<text x="574" y="725.0" class="small" >= 벽의 주된 방향 (straighten_map.py 와 같은 방식), 벽이 적으면 로봇 방향</text>
<circle cx="564" cy="741.5" r="2.6" fill="#6b7280"/>
<text x="574" y="745.5" class="item" >줄 폭 = 센서 거리 5.0 m × 0.65 = 3.25 m (줄 가운데서 양옆 끝까지 보이게)</text>
<text x="560" y="766.0" class="key" >매 반복</text>
<circle cx="564" cy="782.5" r="2.6" fill="#6b7280"/>
<text x="574" y="786.5" class="item" >후보를 줄별로 나누고, 지금 줄에서 진행 방향 앞쪽(0.3 m 뒤까지 허용) 후보만 봄</text>
<circle cx="564" cy="803.0" r="2.6" fill="#6b7280"/>
<text x="574" y="807.0" class="item" >앞쪽 후보가 있으면 → 중심선 점으로 곧게 전진</text>
<text x="574" y="827.5" class="small" >로봇보다 1.0~2.5 m 앞, 중심선에서 줄 폭/2 안, 벽 0.35 m 밖의 빈 셀 중</text>
<text x="574" y="848.0" class="small" >점수 = 전진 거리 − 1.5 × 중심선과의 거리 가 최대 (옆 입구는 지나가며 LiDAR 로 봄)</text>
<circle cx="564" cy="864.5" r="2.6" fill="#6b7280"/>
<text x="574" y="868.5" class="item" >중심선 점이 없거나 가장 먼 후보보다 1 m 넘게 앞이면 → 가장 가까운 앞쪽 후보</text>
<circle cx="564" cy="885.0" r="2.6" fill="#6b7280"/>
<text x="574" y="889.0" class="item" >앞쪽 후보가 없으면: 이동 중이면 지금 목표까지 감, 멈춘 뒤 2.5 s 동안 계속 없으면 줄 바꿈</text>
<text x="574" y="909.5" class="small" >(SLAM 맵 갱신 2 s 보다 길게 기다림: 조금 더 가면 새 경계가 보이는 경우가 많음)</text>
<circle cx="564" cy="926.0" r="2.6" fill="#6b7280"/>
<text x="574" y="930.0" class="item" >줄 바꿈: 후보가 있는 가장 가까운 줄로 (같은 쪽 우선, 처음엔 후보가 많은 쪽), 방향 반대</text>
<circle cx="564" cy="946.5" r="2.6" fill="#6b7280"/>
<text x="574" y="950.5" class="item" >그래도 고를 후보가 없으면 → ⑥ 자투리 정리</text>

<text x="910" y="1150" class="td" >이동 취소, 그 목표 1.0 m 제외 후 다시 고름</text>
<text x="60" y="1177" class="key" >끝까지 가기 (commit)</text>
<text x="370" y="1177" class="td" >한 번 도착 전에 떠난 목표(0.8 m 안)가 다시 뽑힘, 또는 0.7 m 이내 가까운 목표</text>
<text x="910" y="1177" class="td" >근접 전환 없이 도착까지 감 (입구 두 곳 사이 왕복 방지)</text>

<text x="370" y="1204" class="td" >0.4 m 안에 다시 도착했는데 프론티어가 남음</text>
<text x="910" y="1204" class="td" >그 자리에서는 볼 수 없는 곳 → 0.5 m 제외</text>
<text x="60" y="1231" class="key" >실패 / 거절</text>
<text x="370" y="1231" class="td" >이동 실패, 서버 거절(금지 구역·같은 지점 반복), 90초 안에 못 감</text>
<text x="910" y="1231" class="td" >0.5 m 제외 (같은 곳 두 번째·금지 구역이면 1.0 m), 연속 5번이면 탐색 종료</text>
