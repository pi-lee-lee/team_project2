      .subtitle { font-size: 15px; fill: #4b5563; }
      .ph { font-size: 17px; font-weight: 800; fill: #ffffff; }
      .tag { font-size: 11px; fill: #ffffff; opacity: 0.9; }
      .num { font-size: 13px; font-weight: 800; }
      .b { font-size: 13px; fill: #1f2937; }
      .bb { font-size: 13px; font-weight: 700; fill: #111827; }
