<text x="52.0" y="154.0" class="num" text-anchor="middle" style="fill:#ea580c">1</text>
<text x="72.0" y="155.0" class="ph" text-anchor="start">정적 / 움직이는 물체 나누기</text>
<text x="518.0" y="154.0" class="tag mono" text-anchor="end">compute()</text>
