<rect width="1600" height="900" fill="#f4f6fb"/>
<rect x="30" y="26" width="8" height="58" rx="3" fill="#ea580c"/>
<text x="52.0" y="62.0" class="title" text-anchor="start">주행 모듈 3 — 추적 결과를 주행에 쓰는 법</text>
<text x="54.0" y="86.0" class="subtitle" text-anchor="start">멈춘 물체는 스캔 점까지의 거리로(시간 무관), 움직이는 물체는 등속 예측으로(시간별) 따로 검사한다. Frenet 은 0.1 초마다 후보 궤적 867개를 이 두 검사로 거르고 비용이 가장 작은 것을 고른다.</text>
<rect x="30.0" y="130" width="500.0" height="360" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<path d="M30.0,140 a10,10 0 0 1 10,-10 h480.0 a10,10 0 0 1 10,10 v28 h-500.0 z" fill="#ea580c"/>
