<text x="72.0" y="696.0" class="s" text-anchor="start">로봇 반경 0.24 m 안은 통과 불가, 0.55 m 까지 벽 가까울수록 비용 → 통로 가운데</text>

<text x="72.0" y="735.5" class="s" text-anchor="start">막혀서 길이 없으면 반경 0.20 → 최근 3 초 장애물만 → 실패 순서</text>

<text x="592.0" y="735.5" class="s" text-anchor="start">5번 못 보면 삭제, 속도 0.08 m/s 이상이면 &quot;움직이는 물체&quot;</text>

<text x="1100.0" y="679.0" class="b" text-anchor="start">움직이는 물체: 0~4 초 등속 예측 원과 후보 궤적을 같은 시각끼리 비교</text>
<text x="1112.0" y="696.0" class="s" text-anchor="start">원 반지름 = 물체 반경 + 0.15 + 0.03·t, 차체 뒤로 완전히 지난 물체는 무시</text>

<circle cx="1090.0" cy="738.0" r="2.4" fill="#374151"/>

<text x="1100.0" y="766.5" class="b" text-anchor="start">후보가 모두 탈락하면 정지 대기, 5 초 넘으면 물러나기 → A* 재계획</text>
