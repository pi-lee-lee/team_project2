<line x1="150" y1="18" x2="178" y2="18" stroke="#059669" stroke-width="2.4" marker-end="url(#a_ros)"/>
<text x="186.0" y="22.0" class="small" text-anchor="start">ROS 2 토픽/서비스</text>
<line x1="290" y1="18" x2="318" y2="18" stroke="#0891b2" stroke-width="2.4" marker-end="url(#a_http)"/>
