<rect width="1600" height="900" fill="#f4f6fb"/>
<rect x="30" y="28" width="8" height="56" rx="3" fill="#2563eb"/>
<text x="52.0" y="62.0" class="title" text-anchor="start">라이프사이클 3 — 운영: 이동 1회</text>
<text x="54.0" y="86.0" class="subtitle" text-anchor="start">지도에서 지점 클릭 → services 가 작업 생성 → 브리지가 A* 경로를 Frenet 으로 따라감 → 도착 보고 → IDLE</text>
<g transform="translate(1150,30)">
<rect x="0" y="0" width="420" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<line x1="14" y1="18" x2="42" y2="18" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a_ws)"/>
