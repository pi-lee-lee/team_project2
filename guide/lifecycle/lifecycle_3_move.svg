<circle cx="215.77000000000004" cy="204" r="9" fill="#2563eb"/>
<text x="215.8" y="208.0" class="num" text-anchor="middle">1</text>
<text x="305.0" y="208.0" class="lbl halo" text-anchor="middle">goto_point {x, y, yaw}</text>
<text x="305.0" y="229.0" class="lblsub halo" text-anchor="middle">지도 클릭 → "여기로 이동"</text>
<rect x="556.9" y="194" width="286.2" height="78" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="568.9" y="212.0" class="lbl" text-anchor="start">services.goto_point</text>
<text x="568.9" y="229.0" class="note" text-anchor="start">OFFLINE · 진행 작업 · 금지 구역 검사</text>
<text x="568.9" y="246.0" class="note" text-anchor="start">Task + TaskStep(move) 생성</text>
<text x="568.9" y="263.0" class="note" text-anchor="start">step MOVING · Robot.state = MOVING (DB)</text>
<line x1="487" y1="290" x2="793" y2="290" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="508.1300000000001" cy="280" r="9" fill="#2563eb"/>
<text x="508.1" y="284.0" class="num" text-anchor="middle">2</text>
<text x="640.0" y="284.0" class="lbl halo" text-anchor="middle">goto {goal_id: step-&lt;id&gt;, x, y, yaw}</text>
<line x1="473" y1="290" x2="137" y2="290" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<text x="305.0" y="284.0" class="lbl halo" text-anchor="middle">state MOVING · log</text>
<line x1="807" y1="330" x2="1083" y2="330" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<circle cx="844.59" cy="320" r="9" fill="#059669"/>
<text x="844.6" y="324.0" class="num" text-anchor="middle">3</text>
<text x="945.0" y="324.0" class="lbl halo" text-anchor="middle">astar/get_plan (GetPlan)</text>
<text x="945.0" y="345.0" class="lblsub halo" text-anchor="middle">출발 = TF map→base_footprint</text>
<rect x="1141.0" y="344" width="198.0" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="1153.0" y="362.0" class="note" text-anchor="start">A*: 점유 ≥65 · 미탐색 = 벽</text>
<text x="1153.0" y="379.0" class="note" text-anchor="start">기억한 장애물 · 금지 구역 회피</text>
<line x1="1083" y1="400" x2="807" y2="400" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<circle cx="892.3" cy="390" r="9" fill="#059669"/>
<text x="892.3" y="394.0" class="num" text-anchor="middle">4</text>
<text x="945.0" y="394.0" class="lbl halo" text-anchor="middle">경로 (Path)</text>
<line x1="793" y1="400" x2="487" y2="400" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<text x="640.0" y="394.0" class="lbl halo" text-anchor="middle">path</text>
<line x1="473" y1="400" x2="137" y2="400" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<text x="305.0" y="394.0" class="lbl halo" text-anchor="middle">path (LIVE 중계)</text>
<rect x="666.6" y="418" width="266.8" height="27" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="678.6" y="436.0" class="note" text-anchor="start">FrenetFollower: 경로 → 스플라인 기준선</text>
<rect x="40" y="458" width="227.44000000000005" height="20" rx="6" fill="#64748b"/>
<text x="48.0" y="472.0" class="num" text-anchor="start" style="font-size:12px">반복 · 0.1초마다 (제어 타이머 0.05초)</text>
<rect x="650.4" y="486" width="359.1" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="662.4" y="504.0" class="lbl" text-anchor="start">위치 = map→odom (TF) 에 odom→base (/odom) 합성</text>
<text x="662.4" y="521.0" class="note" text-anchor="start">/odom 이 0.5초보다 오래되면 서서 기다림</text>
<rect x="710.1" y="540" width="239.8" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="722.1" y="558.0" class="note" text-anchor="start">후보 궤적 (옆 오프셋 × 거리 × 속도)</text>
<text x="722.1" y="575.0" class="note" text-anchor="start">중 안전하고 비용 가장 작은 것 → v, w</text>
<line x1="807" y1="608" x2="1413" y2="608" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<circle cx="1179.81" cy="598" r="9" fill="#059669"/>
<text x="1179.8" y="602.0" class="num" text-anchor="middle">5</text>
<text x="1255.0" y="602.0" class="lbl halo" text-anchor="middle">cmd_vel_pc (v, w)</text>
<rect x="1331.1" y="622" width="177.8" height="27" rx="7" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
<text x="1343.1" y="640.0" class="note" text-anchor="start">워치독 → cmd_vel → 바퀴</text>
<line x1="1413" y1="672" x2="807" y2="672" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<circle cx="1129.3700000000001" cy="662" r="9" fill="#059669"/>
<text x="1129.4" y="666.0" class="num" text-anchor="middle">6</text>
<text x="1255.0" y="666.0" class="lbl halo" text-anchor="middle">/odom · /scan · /tf (odom→base)</text>
<line x1="1083" y1="640" x2="807" y2="640" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<text x="945.0" y="634.0" class="lbl halo" text-anchor="middle">/tf map→odom (AMCL 보정)</text>
<line x1="793" y1="700" x2="487" y2="700" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="511.2500000000001" cy="690" r="9" fill="#2563eb"/>
<text x="511.3" y="694.0" class="num" text-anchor="middle">7</text>
<text x="640.0" y="694.0" class="lbl halo" text-anchor="middle">pose · local_plan · scan · obstacles</text>
<line x1="473" y1="700" x2="137" y2="700" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<text x="305.0" y="694.0" class="lbl halo" text-anchor="middle">LIVE 중계 (DB 안 씀)</text>
<rect x="220.1" y="478" width="219.8" height="95" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="232.1" y="496.0" class="lbl" text-anchor="start">막힘 처리 (브리지 안)</text>
<text x="232.1" y="513.0" class="note" text-anchor="start">정적 장애물만 → 1초 뒤 A* 재계획</text>
<text x="232.1" y="530.0" class="note" text-anchor="start">  (목표당 4회, A* 가 장애물 기억)</text>
<text x="232.1" y="547.0" class="note" text-anchor="start">그 밖 → blocked_timeout 5초</text>
<text x="232.1" y="564.0" class="note" text-anchor="start">  → 물러나기/돌기 → 재계획</text>
<rect x="694.8" y="734" width="210.5" height="27" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="706.8" y="752.0" class="note" text-anchor="start">도착: 목표 방향으로 회전 후 정지</text>
<line x1="793" y1="790" x2="487" y2="790" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="516.58" cy="780" r="9" fill="#2563eb"/>
<text x="516.6" y="784.0" class="num" text-anchor="middle">8</text>
<text x="640.0" y="784.0" class="lbl halo" text-anchor="middle">nav_status {goal_id, succeeded}</text>
<text x="640.0" y="805.0" class="lblsub halo" text-anchor="middle">실패면 failed + 이유</text>
<rect x="182.4" y="734" width="235.2" height="61" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="194.4" y="752.0" class="note" text-anchor="start">handle_nav_status: step DONE</text>
<text x="194.4" y="769.0" class="note" text-anchor="start">→ advance: 남은 단계 없음</text>
<text x="194.4" y="786.0" class="note" text-anchor="start">→ Task done · Robot.state = IDLE</text>
<line x1="473" y1="840" x2="137" y2="840" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="200.43000000000004" cy="830" r="9" fill="#2563eb"/>
<text x="200.4" y="834.0" class="num" text-anchor="middle">9</text>
<text x="305.0" y="834.0" class="lbl halo" text-anchor="middle">state IDLE · log "작업 완료"</text>
<text x="36.0" y="872.0" class="small" text-anchor="start">실패(failed): 단일 이동은 Task failed + IDLE, 여러 단계 작업은 ERROR 로 두고 재시도/건너뛰기/취소를 기다림.</text>
<text x="36.0" y="887.0" class="small" text-anchor="start">진행 중 "취소": cancel → 브리지가 목표를 버리고 canceled 보고.</text>
</svg>
