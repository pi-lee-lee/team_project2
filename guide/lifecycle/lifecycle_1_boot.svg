<rect width="1600" height="900" fill="#f4f6fb"/>
<rect x="30" y="28" width="8" height="56" rx="3" fill="#2563eb"/>
<text x="52.0" y="62.0" class="title" text-anchor="start">라이프사이클 1 — 기동 (scripts/run.sh)</text>
<text x="54.0" y="86.0" class="subtitle" text-anchor="start">실물·지도 모드 기준: run.sh --robot real --mode map --map &lt;맵.yaml&gt;. 순서 = Django → 로봇(Pi) → 위치 추정 → 브리지. 브라우저는 아직 없음</text>
