<rect x="218.8" y="186" width="162.3" height="61" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="230.8" y="204.0" class="lbl" text-anchor="start">사람이 터미널에서 실행</text>
<text x="230.8" y="221.0" class="note" text-anchor="start">run.sh --robot real</text>
<text x="230.8" y="238.0" class="note" text-anchor="start">         --mode map</text>
<rect x="408.9" y="196" width="302.2" height="61" rx="7" fill="#f9fafb" stroke="#6b7280" stroke-width="1.4"/>
<text x="420.9" y="214.0" class="note" text-anchor="start">준비: run.lock 잠금 (동시 실행 거절)</text>
<text x="420.9" y="231.0" class="note" text-anchor="start">남은 ROS 노드 정리 (stop_ros.sh, 서버는 유지)</text>
<text x="420.9" y="248.0" class="note" text-anchor="start">logs/run_mode.env 기록 → env.sh: 도메인 44</text>
<rect x="1495.6" y="251" width="80.39999999999999" height="22" rx="11" fill="#e2e8f0"/>
<text x="1535.8" y="266.5" class="sec" text-anchor="middle">1) 웹 서버</text>
<line x1="307" y1="292" x2="473" y2="292" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="320.14000000000004" cy="282" r="9" fill="#6b7280"/>
<text x="320.1" y="286.0" class="num" text-anchor="middle">1</text>
<text x="390.0" y="286.0" class="lbl halo" text-anchor="middle">start_server.sh</text>
<rect x="399.4" y="306" width="321.2" height="95" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="411.4" y="324.0" class="lbl" text-anchor="start">Django 시작: runserver 0.0.0.0:8000 (daphne)</text>
<text x="411.4" y="341.0" class="note" text-anchor="start">HTTP  /  · /robot · /order</text>
<text x="411.4" y="358.0" class="note" text-anchor="start">WS  /ws/ui/  · /ws/robot/&lt;이름&gt;/  접속 대기</text>
<text x="411.4" y="375.0" class="note" text-anchor="start">Robot.state = DB 의 직전 값 (보통 OFFLINE)</text>
<text x="411.4" y="392.0" class="note" text-anchor="start">이미 떠 있으면 건너뜀 (curl :8000) · 3초 대기</text>
<rect x="1481.82" y="403" width="94.17999999999998" height="22" rx="11" fill="#e2e8f0"/>
<text x="1528.9" y="418.5" class="sec" text-anchor="middle">2) 로봇 (Pi)</text>
<line x1="307" y1="446" x2="1413" y2="446" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="733.94" cy="436" r="9" fill="#6b7280"/>
<text x="733.9" y="440.0" class="num" text-anchor="middle">2</text>
<text x="900.0" y="440.0" class="lbl halo" text-anchor="middle">ssh test@192.168.0.181 → turtlebot3 bringup</text>
<text x="900.0" y="461.0" class="lblsub halo" text-anchor="middle">이미 실행 중이면 그대로 · 12초 뒤 ~/warehouse_bringup.log 의 "Run!" 확인</text>
<line x1="307" y1="494" x2="1413" y2="494" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="763.84" cy="484" r="9" fill="#6b7280"/>
<text x="763.8" y="488.0" class="num" text-anchor="middle">3</text>
<text x="900.0" y="488.0" class="lbl halo" text-anchor="middle">pi_cmd_watchdog.py 복사 후 다시 실행</text>
<text x="900.0" y="509.0" class="lblsub halo" text-anchor="middle">cmd_vel_pc → cmd_vel 전달, 0.5초 끊기면 정지</text>
<line x1="307" y1="542" x2="1413" y2="542" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="771.6400000000001" cy="532" r="9" fill="#6b7280"/>
<text x="771.6" y="536.0" class="num" text-anchor="middle">4</text>
<text x="900.0" y="536.0" class="lbl halo" text-anchor="middle">pi_camera.sh on (yolo/camera.sh)</text>
<text x="900.0" y="557.0" class="lblsub halo" text-anchor="middle">/csi/image_raw/compressed · 계속 켜 둠 (--no-camera 면 끔)</text>
<rect x="1287.4" y="562" width="265.2" height="78" rx="7" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
<text x="1299.4" y="580.0" class="lbl" text-anchor="start">Pi 가 발행 (Fast DDS)</text>
<text x="1299.4" y="597.0" class="note" text-anchor="start">/scan · /odom · /imu · /battery_state</text>
<text x="1299.4" y="614.0" class="note" text-anchor="start">/tf  (odom → base_footprint)</text>
<text x="1299.4" y="631.0" class="note" text-anchor="start">/tf_static  (URDF 장착 위치)</text>
<rect x="1482.6" y="643" width="93.39999999999999" height="22" rx="11" fill="#e2e8f0"/>
<text x="1529.3" y="658.5" class="sec" text-anchor="middle">3) 위치 추정</text>
<line x1="307" y1="686" x2="1083" y2="686" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="590.4300000000001" cy="676" r="9" fill="#6b7280"/>
<text x="590.4" y="680.0" class="num" text-anchor="middle">5</text>
<text x="760.0" y="680.0" class="lbl halo" text-anchor="middle">start_nav2.sh &lt;맵.yaml&gt; → map_server + AMCL</text>
<text x="760.0" y="701.0" class="lblsub halo" text-anchor="middle">SLAM 모드: start_slam.sh → slam_toolbox · 8초 대기</text>
<rect x="995.0" y="700" width="370.0" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="1007.0" y="718.0" class="note" text-anchor="start">map_server: /map 발행</text>
<text x="1007.0" y="735.0" class="note" text-anchor="start">AMCL: scan_level · 초기 위치 대기 (map→odom 아직 없음)</text>
<rect x="1468.82" y="745" width="107.17999999999999" height="22" rx="11" fill="#e2e8f0"/>
<text x="1522.4" y="760.5" class="sec" text-anchor="middle">4) A* + 브리지</text>
<line x1="307" y1="786" x2="793" y2="786" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="373.00999999999993" cy="776" r="9" fill="#6b7280"/>
<text x="373.0" y="780.0" class="num" text-anchor="middle">6</text>
<text x="560.0" y="780.0" class="lbl halo" text-anchor="middle">start_bridge.sh → ros2 launch warehouse.launch.py</text>
<text x="560.0" y="801.0" class="lblsub halo" text-anchor="middle">같이 뜸: astar_planner · start_yolo.sh (검출기 enabled=false) · 8초 대기</text>
<rect x="702.3" y="806" width="295.4" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="714.3" y="824.0" class="lbl" text-anchor="start">bridge_node: /scan /odom /imu /map 구독</text>
<text x="714.3" y="841.0" class="note" text-anchor="start">서버 WebSocket 접속 시도 → 2장</text>
<rect x="1058.5" y="806" width="243.0" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="1070.5" y="824.0" class="note" text-anchor="start">+ astar_planner (astar/get_plan)</text>
<text x="1070.5" y="841.0" class="note" text-anchor="start">+ component_detector_switch</text>
<text x="312.0" y="834.0" class="lblsub halo" text-anchor="start">5) 안내 출력 후 run.sh 종료</text>
<text x="312.0" y="848.0" class="lblsub halo" text-anchor="start">띄운 것은 백그라운드 (logs/*.log)</text>
<rect x="81.1" y="600" width="97.8" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="93.1" y="618.0" class="note" text-anchor="start">아직 참여 전</text>
<text x="93.1" y="635.0" class="note" text-anchor="start">2장에서 접속</text>
<text x="36.0" y="872.0" class="small" text-anchor="start">시뮬레이션(--robot sim): 2) 가 start_sim.sh (Gazebo + sim_real_io.py + 명령 감시, 모두 PC) 로 바뀌고, 5) 에서 tools/localize.py 로 초기 위치를 자동 지정.</text>
<text x="36.0" y="887.0" class="small" text-anchor="start">실물 SLAM: 3) 직전에 Pi 에서 /reset_odometry (원점 = 지금 로봇 자리).  웹 "실행 모드" 카드도 같은 run.sh 를 서버(runner.py)가 실행.</text>
</svg>
