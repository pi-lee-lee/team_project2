<text x="54.0" y="86.0" class="subtitle" text-anchor="start">Wi-Fi 지연과 연결 끊김은 각 단계에서 멈추고 기다림. 종료는 stop_ros.sh: PC 의 ROS 노드만 끄고 Pi 는 그대로</text>
