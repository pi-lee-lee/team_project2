<text x="620.0" y="674.0" class="lbl halo" text-anchor="middle">SIGINT → SIGTERM → SIGKILL (bridge · launch)</text>
<text x="620.0" y="695.0" class="lblsub halo" text-anchor="middle">실행 스크립트 → ros2 launch → 노드 순</text>
