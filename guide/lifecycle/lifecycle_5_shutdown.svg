<text x="584.4" y="574.0" class="note" text-anchor="start">UIConsumer.disconnect: 그룹 ui 에서 빠질 뿐</text>
<text x="584.4" y="591.0" class="note" text-anchor="start">로봇 · 작업은 그대로 진행</text>
<rect x="1371.3200000000002" y="605" width="204.67999999999986" height="22" rx="11" fill="#e2e8f0"/>
<text x="1473.7" y="620.5" class="sec" text-anchor="middle">D. 종료: scripts/stop_ros.sh</text>
