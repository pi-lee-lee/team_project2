<text x="860.0" y="756.0" class="lbl halo" text-anchor="middle">AMCL · map_server · lifecycle_manager · A* · YOLO 종료</text>
<line x1="307" y1="806" x2="473" y2="806" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="331.44000000000005" cy="796" r="9" fill="#6b7280"/>
<text x="331.4" y="800.0" class="num" text-anchor="middle">8</text>
<text x="400.0" y="800.0" class="lbl halo" text-anchor="middle">--all / --server</text>
<text x="496.0" y="812.0" class="lblsub halo" text-anchor="start">runserver 종료 · --all 은 ROS 2 데몬도 종료</text>
<rect x="1325.3" y="720" width="189.4" height="61" rx="7" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
<text x="1337.3" y="738.0" class="lbl" text-anchor="start">bringup · 워치독 · 카메라는</text>
<text x="1337.3" y="755.0" class="note" text-anchor="start">건드리지 않음 → 계속 켜 둠</text>
<text x="1337.3" y="772.0" class="note" text-anchor="start">(다음 run.sh 가 그대로 씀)</text>
<text x="36.0" y="872.0" class="small" text-anchor="start">넘어짐(35° 0.5초) · 장애물에 걸쳐 기울기 → 정지/물러나기 후 부딪힌 자리를 A* 에 기억 (astar/obstacle, 120초).</text>
<text x="36.0" y="887.0" class="small" text-anchor="start">시뮬레이션은 stop_ros.sh 가 Gazebo 와 PC 의 명령 감시까지 같이 정리.</text>
</svg>
