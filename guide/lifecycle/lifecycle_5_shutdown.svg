<text x="218.0" y="650.0" class="lbl" text-anchor="start">사람: stop_ros.sh [--all]</text>
<line x1="307" y1="680" x2="793" y2="680" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a_run)"/>
<circle cx="449.13" cy="670" r="9" fill="#6b7280"/>
