<rect x="1326.0800000000002" y="185" width="249.91999999999993" height="22" rx="11" fill="#e2e8f0"/>
<text x="1451.0" y="200.5" class="sec" text-anchor="middle">A. 브리지 → Django (WS② 로봇 연결)</text>
<line x1="793" y1="232" x2="487" y2="232" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="504.4900000000001" cy="222" r="9" fill="#2563eb"/>
<text x="504.5" y="226.0" class="num" text-anchor="middle">1</text>
<text x="640.0" y="226.0" class="lbl halo" text-anchor="middle">ws://localhost:8000/ws/robot/tb3/</text>
<text x="640.0" y="247.0" class="lblsub halo" text-anchor="middle">끊기면 2초마다 재접속</text>
<rect x="198.6" y="246" width="202.8" height="44" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="210.6" y="264.0" class="note" text-anchor="start">RobotConsumer.connect</text>
<text x="210.6" y="281.0" class="note" text-anchor="start">그룹 robot_tb3 가입 · accept</text>
<line x1="793" y1="300" x2="487" y2="300" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="502.6700000000001" cy="290" r="9" fill="#2563eb"/>
<text x="502.7" y="294.0" class="num" text-anchor="middle">2</text>
<text x="640.0" y="294.0" class="lbl halo" text-anchor="middle">hello {mode, session, active_goal_id}</text>
<rect x="159.4" y="314" width="281.2" height="61" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="171.4" y="332.0" class="lbl" text-anchor="start">services.robot_connected</text>
<text x="171.4" y="349.0" class="note" text-anchor="start">진행 작업 없음 → Robot.state = IDLE (DB)</text>
<text x="171.4" y="366.0" class="note" text-anchor="start">state 를 그룹 ui 로 (아직 받는 화면 없음)</text>
<line x1="793" y1="384" x2="487" y2="384" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="513.07" cy="374" r="9" fill="#2563eb"/>
<text x="513.1" y="378.0" class="num" text-anchor="middle">3</text>
<text x="640.0" y="378.0" class="lbl halo" text-anchor="middle">map (OccupancyGrid, zlib+base64)</text>
<text x="640.0" y="399.0" class="lblsub halo" text-anchor="middle">map_server 의 /map 을 받아 보냄</text>
<rect x="143.1" y="400" width="253.8" height="27" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="155.1" y="418.0" class="note" text-anchor="start">handle_map → PNG 로 Map 저장·활성화</text>
<line x1="487" y1="440" x2="793" y2="440" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="502.93000000000006" cy="430" r="9" fill="#2563eb"/>
<text x="502.9" y="434.0" class="num" text-anchor="middle">4</text>
<text x="640.0" y="434.0" class="lbl halo" text-anchor="middle">zones (그 맵의 금지 구역 → A* 가 피함)</text>
<line x1="793" y1="476" x2="487" y2="476" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="468.35" cy="466" r="9" fill="#2563eb"/>
<text x="468.4" y="470.0" class="num" text-anchor="middle">5</text>
<text x="640.0" y="470.0" class="lbl halo" text-anchor="middle">params · 이후 계속 health · pose · scan · battery</text>
<text x="640.0" y="491.0" class="lblsub halo" text-anchor="middle">pose · health 등은 LIVE 메모리에만 (DB 저장 안 함)</text>
<rect x="1423.3200000000002" y="505" width="152.67999999999995" height="22" rx="11" fill="#e2e8f0"/>
<text x="1499.7" y="520.5" class="sec" text-anchor="middle">B. ROS 2 안 (Pi → PC)</text>
<line x1="1413" y1="550" x2="807" y2="550" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<circle cx="1113.77" cy="540" r="9" fill="#059669"/>
<text x="1113.8" y="544.0" class="num" text-anchor="middle">6</text>
<text x="1255.0" y="544.0" class="lbl halo" text-anchor="middle">/scan · /odom · /imu · /tf · /tf_static</text>
<line x1="807" y1="590" x2="1083" y2="590" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<circle cx="895.6800000000001" cy="580" r="9" fill="#059669"/>
<text x="895.7" y="584.0" class="num" text-anchor="middle">7</text>
<text x="945.0" y="584.0" class="lbl halo" text-anchor="middle">scan_level</text>
<text x="945.0" y="605.0" class="lblsub halo" text-anchor="middle">기울지 않았을 때만 /scan 을 다시 발행</text>
<rect x="1079.5" y="612" width="261.0" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="1091.5" y="630.0" class="note" text-anchor="start">AMCL: 초기 위치 전에는 map→odom 없음</text>
<text x="1091.5" y="647.0" class="note" text-anchor="start">→ health.localized = false</text>
<rect x="1360.4" y="649" width="215.59999999999997" height="22" rx="11" fill="#e2e8f0"/>
<text x="1468.2" y="664.5" class="sec" text-anchor="middle">C. 브라우저 참여 (WS① UI 연결)</text>
<line x1="137" y1="696" x2="473" y2="696" stroke="#0891b2" stroke-width="2.2" marker-end="url(#a_http)"/>
<circle cx="198.87000000000006" cy="686" r="9" fill="#0891b2"/>
<text x="198.9" y="690.0" class="num" text-anchor="middle">8</text>
<text x="305.0" y="690.0" class="lbl halo" text-anchor="middle">GET /  → index.html · app.js</text>
<line x1="137" y1="734" x2="473" y2="734" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="179.11000000000007" cy="724" r="9" fill="#2563eb"/>
<text x="179.1" y="728.0" class="num" text-anchor="middle">9</text>
<text x="305.0" y="728.0" class="lbl halo" text-anchor="middle">WebSocket('/ws/ui/?robot=tb3')</text>
<rect x="606.2" y="682" width="307.5" height="78" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="618.2" y="700.0" class="lbl" text-anchor="start">UIConsumer.connect: 그룹 ui 가입</text>
<text x="618.2" y="717.0" class="note" text-anchor="start">snapshot = DB (robot · task · map · locations</text>
<text x="618.2" y="734.0" class="note" text-anchor="start">  · zones · logs) + LIVE (pose · path · health</text>
<text x="618.2" y="751.0" class="note" text-anchor="start">  · params · yolo) + 실행 모드</text>
<line x1="473" y1="772" x2="137" y2="772" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="209.79000000000002" cy="762" r="9" fill="#2563eb"/>
<text x="209.8" y="766.0" class="num" text-anchor="middle">10</text>
<text x="305.0" y="766.0" class="lbl halo" text-anchor="middle">snapshot (접속 직후 1번)</text>
<text x="305.0" y="787.0" class="lblsub halo" text-anchor="middle">이후 state · pose · health · scan · log …</text>
<rect x="1410.58" y="801" width="165.42" height="22" rx="11" fill="#e2e8f0"/>
<text x="1493.3" y="816.5" class="sec" text-anchor="middle">D. 초기 위치 (지도 모드)</text>
<line x1="137" y1="844" x2="473" y2="844" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="236.44000000000003" cy="834" r="9" fill="#2563eb"/>
<text x="236.4" y="838.0" class="num" text-anchor="middle">11</text>
<text x="305.0" y="838.0" class="lbl halo" text-anchor="middle">set_initial_pose</text>
<line x1="487" y1="844" x2="793" y2="844" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<text x="640.0" y="838.0" class="lbl halo" text-anchor="middle">initial_pose {x, y, yaw}</text>
<line x1="807" y1="844" x2="1083" y2="844" stroke="#059669" stroke-width="2.2" marker-end="url(#a_ros)"/>
<text x="945.0" y="838.0" class="lbl halo" text-anchor="middle">/initialpose</text>
<rect x="1194.1" y="828" width="191.8" height="44" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="1206.1" y="846.0" class="note" text-anchor="start">AMCL → /tf map→odom</text>
<text x="1206.1" y="863.0" class="note" text-anchor="start">→ localized: true (health)</text>
<text x="36.0" y="872.0" class="small" text-anchor="start">"위치 자동 찾기" 버튼: runner 가 tools/localize.py --global 실행 (제자리 회전하며 스캔 매칭, 1~3분) → 같은 initial_pose 경로.</text>
<text x="36.0" y="887.0" class="small" text-anchor="start">SLAM 모드는 초기 위치 불필요 (켠 자리가 원점), 맵 이름은 slam_live.</text>
</svg>
