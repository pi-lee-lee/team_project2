      .small { font-size: 11.5px; fill: #4b5563; }
      .sec { font-size: 13px; font-weight: 800; fill: #374151; }
      .num { font-size: 11px; font-weight: 800; fill: #ffffff; }
      .halo { paint-order: stroke; stroke: #f4f6fb; stroke-width: 5px; stroke-linejoin: round; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .cellt { font-size: 15px; font-weight: 800; fill: #111827; }
      .cell { font-size: 12.5px; fill: #374151; }
    </style>
<marker id="a_ws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="a_ros" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="a_run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="a_db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="a_http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
<marker id="a_warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<rect width="1600" height="900" fill="#f4f6fb"/>
<rect x="30" y="28" width="8" height="56" rx="3" fill="#2563eb"/>
<text x="52.0" y="62.0" class="title" text-anchor="start">라이프사이클 2 — 연결 · 등록</text>
<text x="54.0" y="86.0" class="subtitle" text-anchor="start">브리지가 Django 에 접속해 로봇을 등록 → ROS 2 안에서 센서가 돌기 시작 → 마지막으로 브라우저가 접속해 전체 상태(snapshot)를 받음</text>
<g transform="translate(1150,30)">
<rect x="0" y="0" width="420" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<line x1="14" y1="18" x2="42" y2="18" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a_ws)"/>
<text x="50.0" y="22.0" class="small" text-anchor="start">WebSocket (JSON)</text>
<line x1="150" y1="18" x2="178" y2="18" stroke="#059669" stroke-width="2.4" marker-end="url(#a_ros)"/>
<text x="186.0" y="22.0" class="small" text-anchor="start">ROS 2 토픽/서비스</text>
<line x1="290" y1="18" x2="318" y2="18" stroke="#0891b2" stroke-width="2.4" marker-end="url(#a_http)"/>
<text x="326.0" y="22.0" class="small" text-anchor="start">HTTP</text>
<line x1="14" y1="42" x2="42" y2="42" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#a_run)"/>
<text x="50.0" y="46.0" class="small" text-anchor="start">프로세스 실행·종료</text>
<line x1="150" y1="42" x2="178" y2="42" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#a_db)"/>
<text x="186.0" y="46.0" class="small" text-anchor="start">DB 읽기/쓰기</text>
<rect x="290" y="35" width="12" height="14" rx="2" fill="#059669"/>
<text x="308.0" y="46.0" class="small" text-anchor="start">실행 중 (활성)</text>
</g>
<rect x="1500" y="96" width="70" height="22" rx="11" fill="#111827"/>
<text x="1535.0" y="111.0" class="num" text-anchor="middle" style="font-size:12px">2 / 5</text>
<rect x="30" y="122" width="200" height="28" rx="14" fill="#2563eb"/>
<text x="130.0" y="141.0" class="colhead" text-anchor="middle">① 사용자 브라우저</text>
<text x="130.0" y="165.0" class="lanesub" text-anchor="middle">index.html · app.js</text>
<rect x="372" y="122" width="216" height="28" rx="14" fill="#7c3aed"/>
<text x="480.0" y="141.0" class="colhead" text-anchor="middle">② Django 서버 (PC)</text>
<text x="480.0" y="165.0" class="lanesub" text-anchor="middle">daphne :8000 · services.py</text>
<rect x="1290" y="122" width="260" height="28" rx="14" fill="#ea580c"/>
<text x="1420.0" y="141.0" class="colhead" text-anchor="middle">④ 로봇 (Raspberry Pi)</text>
<text x="1420.0" y="165.0" class="lanesub" text-anchor="middle">bringup · 워치독 · 카메라</text>
<rect x="650" y="122" width="590" height="28" rx="14" fill="#059669"/>
<text x="945.0" y="141.0" class="colhead" text-anchor="middle">③ PC · ROS 2 (도메인 44, Cyclone DDS)</text>
<text x="800.0" y="165.0" class="lanesub" text-anchor="middle">bridge_node</text>
<text x="1090.0" y="165.0" class="lanesub" text-anchor="middle">AMCL · map_server · A* · YOLO</text>
