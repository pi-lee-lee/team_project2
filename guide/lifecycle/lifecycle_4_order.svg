<text x="586.0" y="621.0" class="note" text-anchor="start">vs 이 구역 items</text>
<rect x="40" y="640" width="40.0" height="20" rx="6" fill="#64748b"/>
<text x="48.0" y="654.0" class="num" text-anchor="start" style="font-size:12px">분기</text>
