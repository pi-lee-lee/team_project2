<text x="305.0" y="734.0" class="lbl halo" text-anchor="middle">"적재 잘못: A 1/2 ✗" (대기 유지)</text>
<line x1="137" y1="784" x2="473" y2="784" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a_ws)"/>
<circle cx="189.77000000000007" cy="774" r="9" fill="#2563eb"/>
<text x="189.8" y="778.0" class="num" text-anchor="middle">11</text>
<text x="305.0" y="778.0" class="lbl halo" text-anchor="middle">force_next {confirmed: true}</text>
<text x="305.0" y="799.0" class="lblsub halo" text-anchor="middle">사람이 확인하고 진행</text>
<rect x="767.6" y="724" width="264.8" height="27" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
<text x="779.6" y="742.0" class="note" text-anchor="start">다시 confirm_load 를 눌러 재확인도 가능</text>
<rect x="331.5" y="818" width="937.0" height="27" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="343.5" y="836.0" class="note" text-anchor="start">마지막 load 뒤: unload (dropoff) → WAITING_UNLOAD → confirm_unload (남은 개수 0) → move (홈) → succeeded → Task done · IDLE · yolo_set off</text>
<text x="36.0" y="872.0" class="small" text-anchor="start">YOLO 검출기가 없으면 개수 확인 없이 "다음 경유지로 / 강제 보내기"(force_next)로만 진행.</text>
<text x="36.0" y="887.0" class="small" text-anchor="start">카메라는 계속 켜져 있고, 영상은 검출기가 enabled 일 때만 구독되어 Wi-Fi 를 지남.</text>
