# 위치 추정(map_server + AMCL) 전용 설정. scripts/start_nav2.sh 가 기본으로 사용 (NAV2_PARAMS 를 주면 그 파일)
# TurtleBot3 기본값(waffle_pi.yaml)에서 바꾼 것:
#   max_beams 60 → 180       : 작은 방에서 60개 빔으로는 10cm 넘게 어긋난 채 수렴함 (sim 측정: 정지 오차 12cm)
#   sigma_hit 0.2 → 0.1, z_hit/z_rand 0.5/0.5 → 0.9/0.1, laser_likelihood_max_dist 2.0 → 1.0 : 벽에 더 정확히 맞춤
#   update_min_d/a 0.25/0.2 → 0.05/0.1 : 조금만 움직여도 갱신 (기본값은 25cm 를 가야 한 번 갱신)
#   laser_min/max_range      : LDS-02 측정 범위 (0.12 ~ 3.5 m)
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"
