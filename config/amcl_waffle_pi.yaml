# Localization-only settings (map_server + AMCL). Used by default by scripts/start_nav2.sh (or the file given in NAV2_PARAMS)
# Differences from the TurtleBot3 defaults (waffle_pi.yaml):
#   max_beams 180            : with few beams AMCL converges with a large offset in a small room
#   sigma_hit 0.1, z_hit/z_rand 0.9/0.1, laser_likelihood_max_dist 1.0 : fit walls more precisely
#   update_min_d/a 0.05/0.1  : update after small motions (the default only updates every 25 cm)
#   laser_min/max_range      : LDS-02 measurement range
#   scan_topic scan_level    : the bridge only forwards scans taken while the robot is not tilted (when tilted by a bump the floor looks like a wall).
#                              Change to scan when using AMCL without the bridge
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 5.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan_level
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"
