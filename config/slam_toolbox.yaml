# slam_toolbox 설정: 기본값(mapper_params_online_async.yaml)에서 scan_topic 은 /scan_slam (브리지가 발행: 수평일 때 스캔, inf 빔은 range_max 바로 아래로)
# 브리지가 차체가 기울지 않았을 때의 스캔만 scan_level 로 넘긴다 (부딪혀 기울면 LiDAR 가 바닥/상자 윗면을 벽으로 봄)
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_slam   # 브리지가 발행: scan_level 과 같되 아무것도 안 맞은 빔(inf)을 range_max 바로 아래로 바꿈
    use_map_saver: true
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 2.0   # 5.0 이면 자동 탐색이 이미 본 곳으로 계속 감 (맵 반영이 늦음)
    resolution: 0.05
    min_laser_range: 0.0 #for rastering images
    # 이 거리까지 맞은 점을 장애물로 찍고, 이 거리부터 range_max 사이 값은 빈 칸으로만 칠한다.
    # 브리지가 inf 를 range_max - 0.05 로 바꿔 보내므로, 이 값이 그보다 작아야 '안 맞은 빔' 이 빈 공간으로 반영된다.
    # (20 이면 range_max 로 잘려 inf 빔이 전부 버려지고, 넓은 공간은 영영 미탐색으로 남음)
    # 실물 LDS-02 (range_max 100, 측정 8 m): 5.0. 시뮬레이션 LiDAR 는 3.5 m 까지라 start_slam.sh 가 3.4 로 바꿔 띄운다
    max_laser_range: 5.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1   # (기본 0.5) 스캔을 지도에 넣는 이동 거리. 빔 간격(1.5°)이 1.9m 부터 칸(5cm)보다 넓어
                                   # 먼 벽이 점선으로 남던 것 → 더 자주 넣어 여러 위치의 스캔으로 메움
                                   # 0.2 → 0.1: 2초마다 발행되는 맵에 더 많은 스캔이 반영되어 자동 탐색의 다음 경로가 최신 맵을 참조
                                   # (minimum_time_interval 0.5초 때문에 0.15 m/s 직진에서는 실제로 약 7.5cm 마다)
    minimum_travel_heading: 0.1    # (기본 0.5 rad = 29°) 회전도 약 5.7° 마다 (0.2 = 약 11.5° 에서 줄임)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    # 루프 클로저: 반복 구조(선반·좌석·기둥 줄)에서 다른 줄을 같은 곳으로 착각하면 맵 전체가 그 간격만큼 밀린다
    # (sim 강당에서 3.6m, 오도메트리는 정확했음). 인정 기준을 높이고, 찾는 범위는 환경이 아니라 로봇의
    # 누적 오차(바퀴 오도메트리 + 연속 스캔 매칭, 실내 수십 m 주행에 보통 0.5m 이하) 기준 ±1m 로 제한
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6

    # 스캔 맞춤은 오도메트리를 존중하도록: 찾는 범위와 벌점을 로봇 오도메트리 오차 기준으로 정한다.
    # TurtleBot 은 스캔 사이(이동 0.5m / 회전 0.5rad) 오차가 수 cm, 1° 대인데 기본값(±0.25m, ±20°, 약한 벌점)은
    # 반복되거나 특징이 적은 곳에서 틀린 맞춤을 찾을 여지만 줬다 (sim 은 오도메트리 = 실제 위치인데도 맵이 틀어짐)
    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.3   # ±0.15m (기본 0.5)
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 2.0   # ±1m (기본 8.0 = ±4m 는 반복 구조의 옆 줄들이 후보에 들어옴)
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # 오도메트리에서 벗어난 맞춤 위치의 벌점: 점수 × max(하한, 1 - 0.2·(벗어난 거리/값)²)  (값은 내부에서 제곱해 분산으로 씀)
    # 값 = 스캔 사이(0.5 m 이동 또는 0.5 rad 회전) 오도메트리 오차의 표준편차. 실물 TurtleBot 엔코더 오차(1~2 cm, 1~2°)보다 넉넉히.
    # 기본값(0.5 m, 1.0 rad)은 15 cm / 5° 벗어나도 벌점이 1% 안팎이라 사실상 오도메트리를 무시 → 특징이 적은 넓은 방에서
    # 맞춤 점수가 평평하면 위치가 조금씩 끌려가 지도가 틀어짐 (house 에서 0.7 m 까지 누적 확인)
    distance_variance_penalty: 0.05     # 5 cm 벗어나면 0.8, 10 cm 면 하한
    angle_variance_penalty: 0.06        # 약 3.4°. 3.4° 벗어나면 0.8, 7° 면 하한

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.175   # ±10° (기본 0.349 = ±20°)
    coarse_angle_resolution: 0.0349        
    # 벌점 하한: 오도메트리가 크게 틀린 경우(미끄러짐, 부딪힘)엔 오도메트리 자리의 점수가 낮으므로
    # 맞춤 점수가 그 1/하한 배 넘게 좋으면 여전히 바로잡는다. 회전 미끄러짐이 더 흔해서 각도는 조금 덜 막음
    minimum_angle_penalty: 0.5          # (기본 0.9)
    minimum_distance_penalty: 0.3       # (기본 0.5)
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
