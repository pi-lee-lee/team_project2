# slam_toolbox settings, based on mapper_params_online_async.yaml. scan_topic is /scan_slam (published by the bridge: scans while level, inf beams set just below range_max)
# The bridge only forwards scans taken while the body is not tilted as scan_level (when tilted by a bump the LiDAR sees the floor/box tops as walls)
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_slam   # Published by the bridge: same as scan_level but beams that hit nothing (inf) are set just below range_max
    use_map_saver: true
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 2.0   # Frequent updates so auto-exploration plans on a fresh map instead of revisiting seen areas
    resolution: 0.05
    min_laser_range: 0.0 #for rastering images
    # Hits up to this distance are marked as obstacles; values between this and range_max only clear free space.
    # The bridge sends inf as range_max - 0.05, so this must be smaller for 'no-return' beams to clear free space
    # (if it exceeds range_max it is clipped and all inf beams are dropped, leaving large spaces unexplored).
    # Same value for sim, since the sim uses the real-spec model (worlds/models/turtlebot3_waffle_pi_real)
    max_laser_range: 5.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1   # (default 0.5) Travel distance between scans added to the map. Beyond 1.9 m the beam spacing (1.5°) is wider
                                   # than a cell (5 cm), so distant walls would be dotted -> add scans often to fill in from several positions.
                                   # Also puts more scans into the map published every 2 s, so auto-exploration plans on a fresh map
                                   # (about every 1 s at 0.1 m/s; minimum_time_interval 0.5 s is the limit)
    minimum_travel_heading: 0.1    # (default 0.5 rad = 29°) Also add a scan every ~5.7° of rotation
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    # Loop closure: in repeated structures (rows of shelves/seats/pillars), mistaking one row for another shifts the whole map by that spacing.
    # Raise the acceptance thresholds and limit the search range to ±1 m based on the robot's accumulated error
    # (wheel odometry + consecutive scan matching, usually under 0.5 m over tens of meters indoors) rather than the environment
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6

    # Make scan matching respect odometry: the search range and penalties are set from the robot's odometry error.
    # TurtleBot error between scans (0.5 m travel / 0.5 rad rotation) is a few cm and about 1°, while the defaults (±0.25 m, ±20°, weak penalty)
    # only leave room for wrong matches in repetitive or featureless areas
    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.3   # ±0.15m (default 0.5)
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 2.0   # ±1m (the default 8.0 = ±4m lets neighbouring rows of repeated structures become candidates)
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # Penalty for match poses away from odometry: score × max(floor, 1 - 0.2·(offset/value)²)  (the value is squared internally as a variance)
    # value = std. dev. of odometry error between scans (0.5 m travel or 0.5 rad rotation), somewhat larger than real TurtleBot encoder error (1-2 cm, 1-2°).
    # The defaults (0.5 m, 1.0 rad) barely penalize 15 cm / 5° offsets, effectively ignoring odometry -> in large featureless rooms
    # a flat match score lets the pose drift gradually and the map gets distorted
    distance_variance_penalty: 0.05     # 0.8 at 5 cm off, floor at 10 cm
    angle_variance_penalty: 0.06        # about 3.4°. 0.8 at 3.4° off, floor at 7°

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.175   # ±10° (default 0.349 = ±20°)
    coarse_angle_resolution: 0.0349        
    # Penalty floor: when odometry is badly wrong (slip, bump) the score at the odometry pose is low,
    # so a match more than 1/floor times better still corrects it. Rotational slip is more common, so angle is restricted a bit less
    minimum_angle_penalty: 0.5          # (default 0.9)
    minimum_distance_penalty: 0.3       # (default 0.5)
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
