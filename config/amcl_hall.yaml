# 강당/교실용 위치 추정 설정 (run.sh --amcl hall). config/amcl_waffle_pi.yaml(작은 방에서 확인한 값)에서 바꾼 것:
#   책상/의자 다리가 지도에 점으로 찍혀 있고 의자는 매일 움직이므로, 지도와 안 맞는 빔을 더 너그럽게 본다
#   z_hit/z_rand 0.9/0.1 → 0.75/0.15 : 지도에 없는(옮겨진 의자, 사람 다리) 빔이 위치를 끌고 가지 않게
#   sigma_hit 0.1 → 0.15             : 다리 점(지름 2~5cm)은 스캔마다 맞는 자리가 조금씩 달라서
#   laser_likelihood_max_dist 1.0 → 1.5 : 점이 듬성한 지도에서 먼 빔도 가까운 점과 비교되게
#   laser_max_range 3.5 (그대로)     : 넓은 강당 가운데에서는 먼 벽이 보여야 위치가 잡힌다. 실물 LDS-02 가
#                                      3.5m 넘게 안정적으로 재는지 tools/scan_check.py 로 먼저 확인한 뒤 늘리세요
# 나머지는 amcl_waffle_pi.yaml 과 같음 (scan_topic: scan_level 등). 결과가 나쁘면 --amcl 을 빼고 기본값으로 되돌리세요
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.5
    laser_max_range: 5.0     # tools/scan_check.py 로 실물 측정 후 늘릴 수 있음
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
    scan_topic: scan_level
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"
