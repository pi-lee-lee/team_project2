# Localization settings for halls/classrooms (run.sh --amcl hall). Differences from config/amcl_waffle_pi.yaml (small-room values):
#   Desk/chair legs appear as dots in the map and chairs move daily, so beams that don't match the map are treated more leniently
#   z_hit/z_rand 0.75/0.15 : beams not in the map (moved chairs, people's legs) should not drag the pose
#   sigma_hit 0.15         : leg dots (2-5 cm diameter) match at slightly different spots each scan
#   laser_likelihood_max_dist 1.5 : in a sparse map, distant beams are still compared with nearby dots
#   laser_max_range        : in the middle of a large hall, distant walls must be visible to localize. Check that the real LDS-02
#                            measures reliably at long range with tools/scan_check.py before raising it
# Everything else is the same as amcl_waffle_pi.yaml (scan_topic: scan_level etc.). If results are poor, drop --amcl to use the default
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.5
    laser_max_range: 5.0     # Can be raised after measuring the real sensor with tools/scan_check.py
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
    scan_topic: scan_level
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"
