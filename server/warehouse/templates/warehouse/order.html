{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>물건 주문</title>
  <link rel="stylesheet" href="{% static 'warehouse/order.css' %}?v={{ static_version }}">
</head>
<body>
<!-- Orderer's page (phone/PC). On the same Wi-Fi: http://<PC>:8000/order -->
<header>
  <h1>물건 주문</h1>
  <span id="robot-state" class="pill">연결 중</span>
</header>

<main>
  <!-- Order form (when no order is in progress) -->
  <section id="form-view">
    <div class="card">
      <h2><span class="n">1</span>받을 위치</h2>
      <div id="places" class="places"></div>
    </div>
    <div class="card">
      <h2><span class="n">2</span>필요한 물건</h2>
      <div id="items" class="items"></div>
    </div>
    <div class="summary">
      <p id="summary">위치와 물건을 고르세요</p>
      <p id="preview" class="muted small"></p>
      <button id="btn-order" class="primary" disabled>주문하기</button>
      <p id="busy" class="warn"></p>
    </div>
  </section>

  <!-- Progress (when an order is in progress or just finished) -->
  <section id="status-view" hidden>
    <div class="card hero">
      <h2 id="status-title">주문 진행 중</h2>
      <p id="status-sub" class="muted"></p>
      <p id="status-eta" class="eta" hidden></p>
      <p id="status-note" class="warn"></p>
    </div>
    <div class="card">
      <ol id="steps" class="steps"></ol>
    </div>
    <button id="btn-new" class="primary" hidden>새 주문</button>
    <button id="btn-cancel" class="text-danger">주문 취소</button>
  </section>

  <p id="error" class="error" hidden></p>
</main>

<script src="{% static 'warehouse/order.js' %}?v={{ static_version }}"></script>
</body>
</html>
