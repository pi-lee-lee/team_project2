{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>로봇 화면</title>
  <link rel="stylesheet" href="{% static 'warehouse/robot.css' %}?v={{ static_version }}">
</head>
<body class="OFFLINE">
<!-- 로봇 위에 올린 태블릿/휴대폰용 화면 (식당 서빙 로봇처럼 큰 안내 + 확인 버튼) -->
<header>
  <span id="conn" class="conn off">연결 안 됨</span>
  <span id="battery"></span>
  <button id="btn-stop" class="stop" title="즉시 정지하고 진행 중인 요청을 취소">■ 정지</button>
</header>

<main>
  <div id="led" class="led" hidden></div>
  <h1 id="title">연결 중...</h1>
  <p id="sub"></p>
  <table id="counts" class="counts" hidden></table>
  <p id="note" class="note"></p>
  <div class="buttons">
    <button id="btn-manual" class="manual" hidden></button>
    <button id="btn-force" class="force" hidden></button>
  </div>
</main>

<footer>
  <span id="camera">카메라: -</span>
  <span id="step"></span>
</footer>

<script src="{% static 'warehouse/robot.js' %}?v={{ static_version }}"></script>
</body>
</html>
