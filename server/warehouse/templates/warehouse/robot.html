{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>로봇 화면</title>
  <link rel="stylesheet" href="{% static 'warehouse/robot.css' %}?v={{ static_version }}">
</head>
<body class="OFFLINE">
<!-- Page for the tablet/phone mounted on the robot (large prompt + confirm button, like a restaurant serving robot) -->
<header>
  <span id="conn" class="conn off">연결 안 됨</span>
  <span id="battery" class="battery" hidden><i><b id="battery-fill"></b></i><span id="battery-text"></span></span>
</header>

<main>
  <div id="led" class="led" hidden></div>
  <p id="eyebrow" class="eyebrow"></p>
  <h1 id="title">연결 중...</h1>
  <p id="sub"></p>
  <div id="counts" class="counts" hidden></div>
  <p id="note" class="note"></p>
  <div class="buttons">
    <button id="btn-manual" class="manual" hidden></button>
    <button id="btn-force" class="force" hidden></button>
  </div>
</main>

<footer>
  <ol id="route" class="route"></ol>
</footer>

<script src="{% static 'warehouse/robot.js' %}?v={{ static_version }}"></script>
</body>
</html>
